# Objective-3 testbed journald drop-in.
# Install to: /etc/systemd/journald.conf.d/10-testbed.conf  then:
#   sudo systemctl restart systemd-journald
#
# Rationale: the pilots had NO auth.log / persistent host logs. We make journald
# persistent and generous so an all-night capture (scenario 1 runs for 1 h x
# repeats) is never dropped, and we forward to rsyslog so /var/log/auth.log
# (the authlog_shipper fallback, and the human-readable audit trail) stays fed.

[Journal]
Storage=persistent
Compress=yes
# cap disk use so a small SD-card board (RPi 3B+, ~1 GB RAM / limited SD) is safe
SystemMaxUse=2G
SystemKeepFree=1G
RuntimeMaxUse=200M
# do not rate-limit: we must keep every sshd auth line during a brute-force burst
RateLimitIntervalSec=0
RateLimitBurst=0
# keep /var/log/auth.log populated for the fallback shipper + traditional tools
ForwardToSyslog=yes
MaxRetentionSec=0
