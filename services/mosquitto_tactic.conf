# mosquitto_tactic.conf -- TACTIC-IoT v2 broker config (deploy to
# /etc/mosquitto/conf.d/tactic.conf on each victim). mosquitto 2.x binds only to
# localhost by default; this opens the LAN listener Zeek needs to parse.
#
# PLAINTEXT 1883 is intentional: Zeek 9.0 parses MQTT at message level only on
# cleartext. allow_anonymous is acceptable on the air-gapped lab LAN and keeps
# the keys-only, no-stored-passwords rule (no username/password file). The
# bruteforce_mqtt / cmdinject classes work against an anonymous broker by abusing
# CONNECT and PUBLISH, which is the realistic open-broker IoT case.
#
# A TLS variant on 8883 with CLIENT CERTIFICATES is in the commented block for a
# future encrypted-payload study. Under TLS, Zeek loses message-level visibility,
# which is itself a result worth reporting (see roadmap section 12).

listener 1883 0.0.0.0
# AUTHENTICATED broker for the application-log study. allow_anonymous stays true so
# existing anonymous producers (victim telemetry publisher, the app-layer DoS/control
# stages) keep working, but a password_file is defined, so any client that SENDS a
# username is validated: the benign client presents the valid `iotuser` account (auth
# success) and bruteforce_mqtt sends wrong credentials (auth FAILURE, logged). Create
# the file with: sudo mosquitto_passwd -b /etc/mosquitto/passwd iotuser CHANGE_ME
allow_anonymous true
password_file /etc/mosquitto/passwd

# NOTE: persistence / persistence_location / log_dest are already set by the
# packaged /etc/mosquitto/mosquitto.conf. Repeating them here triggers
# "Duplicate persistence_location" and mosquitto exits 3, so this drop-in only
# adds the LAN listener and anonymous access that Zeek needs.

max_queued_messages 1000
max_inflight_messages 20

# ---- APPLICATION-LOG INSTRUMENTATION (v2.1 re-collection) -------------------
# Raise broker logging so the broker's OWN connection log becomes an observable
# application-log source for the MQTT brute-force / probe classes. The broker stays
# anonymous and plaintext (Zeek keeps message-level visibility, no password file is
# stored, keys-only rule intact), so there is no auth *failure* to log. The usable,
# non-leaking signal is CONNECTION CHURN and credential-field variety: a brute opens
# many short CONNECT/DISCONNECT cycles with distinct usernames, which benign long-lived
# clients do not. log_dest is ADDITIVE (mosquitto allows several); syslog -> journald,
# which the existing host collector already captures. Do NOT repeat persistence_location
# here (packaged mosquitto.conf sets it; a duplicate makes mosquitto exit 3).
# Raise verbosity on the PACKAGED file sink (/var/log/mosquitto/mosquitto.log, which
# the base mosquitto.conf already configures). That file is persistent and rotated
# daily, so it survives the MQTT connection-flood volume that evicts journald within
# minutes. We add NO second log_dest (mosquitto rejects a duplicate file sink); these
# two lines just make the existing file log every connection with its credential field.
log_type all
connection_messages true

# ---- TLS variant (keys only), disabled by default --------------------------
# listener 8883 0.0.0.0
# allow_anonymous false
# require_certificate true
# use_identity_as_username true
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key
