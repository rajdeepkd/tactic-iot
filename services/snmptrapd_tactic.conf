# snmptrapd_tactic.conf -- TACTIC-IoT v2.1 local trap sink (deploy to
# /etc/snmp/snmptrapd.conf on each victim, then `systemctl enable --now snmptrapd`).
#
# Purpose: capture the SNMPv2-MIB authenticationFailure traps that snmpd emits when
# bruteforce_snmp guesses a wrong community (snmpd_tactic.conf sets authtrapenable 1,
# trap2sink 127.0.0.1:162). snmptrapd logs each trap to syslog -> journald, which the
# existing host collector already captures, so NO new collector is needed. The logged
# line is a behavioural application-log signal (a bad-community event), not a label
# breadcrumb: it is produced by the agent reacting to real attacker traffic.
#
# Air-gapped lab: authorization is relaxed to accept local traps, nothing is forwarded.

# accept + log every trap from the local agent (community `public`). The default
# snmptrapd log line carries the trap OID -- for a bad-community probe that is
# SNMPv2-MIB::authenticationFailure -- so the featurizer counts authenticationFailure
# lines per window. Kept minimal (no custom format string) for robustness.
authCommunity log public
disableAuthorization yes
