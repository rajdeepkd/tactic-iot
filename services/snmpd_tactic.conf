# snmpd_tactic.conf -- TACTIC-IoT v2 SNMP agent config (deploy to
# /etc/snmp/snmpd.conf on each victim, then `systemctl restart snmpd`).
#
# SNMPv2c. One read-only community (public) for benign monitoring and
# recon_snmp_walk. One SCRATCH read-write community (tactic_rw) scoped to a
# private subtree, for the control_snmp_set unauthorized-write class. The RW
# community is a DOCUMENTED, INTENTIONAL lab weakness, not a secret to protect:
# it enables a protocol-specific write that the network sees as a valid SET and
# the host/agent state reveals. No password is stored; the community string is
# config, and the LAN is air-gapped.

agentAddress udp:161

# ---- APPLICATION-LOG INSTRUMENTATION (v2.1 re-collection) -------------------
# A guessed community that is neither `public` nor `tactic_rw` fails inside the
# agent and is dropped silently by default, so bruteforce_snmp leaves no host trace.
# Enabling the standard SNMPv2-MIB authenticationFailure trap makes every bad-community
# packet emit a trap to a LOCAL snmptrapd sink, whose log line is the observable,
# non-leaking application-log signal (community strings are config, no password is
# stored). snmptrapd logs to syslog -> journald, which the host collector already
# captures. As a second channel, raise the agent's own syslog verbosity by adding
# `-LS6d` to SNMPDOPTS in /etc/default/snmpd so net-snmp also writes "Authentication
# failure (incorrect community name)" lines directly (see docs/RECOLLECT_APPLOG_RUNBOOK.md).
# The smoke test confirms which channel yields usable lines before the full re-collection.
authtrapenable 1
trap2sink 127.0.0.1:162 public

# read-only: benign monitoring + recon enumeration
rocommunity public default

# read-write: a scratch community for the unauthorized-write case. The
# control_snmp_set attack writes sysLocation.0 (a standard writable scalar) and
# restores it in the same run, so the write is reversible and harms nothing.
rwcommunity tactic_rw default

# Device identity. sysName is pinned (read-only identity, fine). sysLocation and
# sysContact are intentionally LEFT UNCONFIGURED: net-snmp makes a scalar that is
# set in snmpd.conf read-only, so pinning sysLocation here would make the
# control_snmp_set class silently fail. Unconfigured, sysLocation.0 / sysContact.0
# are writable via the tactic_rw community, which is exactly the reversible
# unauthorized-write target. No quotes: net-snmp takes the rest of the line
# verbatim, so quotes would become part of the value.
sysName      iot-sensor-node

# expose load/mem so benign SNMP gets return real-looking device telemetry
includeAllDisks 10%

# control_snmp_set target: a writable vendor config scalar backed by a `pass`
# handler, so every SET (benign or attack) makes snmpd EXEC the handler -> a host
# footprint (execve caught by auditd tb_exec + a journald `logger` line). This is
# the SNMP analog of tactic-cmd-handler (MQTT) and modbus LoggingBlock (Modbus),
# and is reliable where an auditd watch on net-snmp's atomically-renamed state
# file is not. Writable scalar = .1.3.6.1.4.1.8072.9999.1.0 (STRING).
pass .1.3.6.1.4.1.8072.9999.1 /opt/testbed/services/snmp_setlog.py
