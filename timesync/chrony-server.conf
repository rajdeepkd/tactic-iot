# chrony-server.conf  ->  /etc/chrony/chrony.conf  on  rpi5-hub (10.0.0.1)
# ---------------------------------------------------------------------------
# Objective-3 testbed LOCAL STRATUM SERVER. The RPi 5 is the single time
# reference for the whole LAN (chosen over the Windows orchestrator because
# W32Time is coarse and chrony does not run on Windows; the RPi 5 is the most
# capable board and is the only one with a battery-backed RTC).
#
# Two operating regimes:
#   (1) UPLINK PRESENT (benign / non-malware capture): discipline to public NTP
#       (or a GPS/PPS HAT for stratum-1) and serve stratum 2-3 to the LAN.
#   (2) AIR-GAPPED (malware scenario, D-Link uplink unplugged, charter s11):
#       fall back to the local clock and FREE-RUN. Absolute UTC drifts slowly
#       but ALL clients still discipline to THIS box, so RELATIVE inter-board
#       skew -- the only thing cross-source alignment needs -- stays tight.
# ---------------------------------------------------------------------------

# --- Upstream sources (used only when the uplink is connected) --------------
pool 2.debian.pool.ntp.org iburst maxsources 4
# OPTIONAL stratum-1 upgrade if a GPS/PPS HAT is fitted on the RPi 5 GPIO:
#   refclock PPS /dev/pps0 lock NMEA refid PPS
#   refclock SHM 0 refid NMEA offset 0.0 precision 1e-1   # gpsd -> shared mem
# With PPS the served time is ~1 us absolute; without it, LAN-relative skew
# (what we report for alignment) is unaffected.

# --- Serve the testbed subnet -----------------------------------------------
allow 10.0.0.0/24
# Keep serving even with no upstream (air-gap): advertise a local stratum so
# clients keep trusting us instead of going unsynchronised.
local stratum 10

# --- Hold time across the air-gap -------------------------------------------
driftfile /var/lib/chrony/chrony.drift   # remembered frequency -> good free-run
rtcsync                                   # keep the RPi 5 RTC disciplined
rtcfile /var/lib/chrony/rtc

# --- Stepping policy: STEP only at startup, SLEW forever after --------------
# After the first 3 updates chrony never steps again, so during any capture
# CLOCK_REALTIME is continuous and monotonic -> wall-clock windowing is safe
# and the REALTIME-vs-MONOTONIC consistency check (see align pipeline) holds.
makestep 1.0 3
maxupdateskew 100.0

# --- Logging feeds the per-capture alignment-quality report -----------------
logdir /var/log/chrony
log tracking measurements statistics
