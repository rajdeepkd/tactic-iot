# chrony-client.conf  ->  /etc/chrony/chrony.conf  on every CLIENT host:
#   rpi3b-1 (10.0.0.11), jetson-1 (10.0.0.20), attacker-1 (10.0.0.99)
# ---------------------------------------------------------------------------
# One reference only: the RPi 5 hub. No public NTP -> deterministic behaviour
# and no dependency on the uplink, so alignment survives the air-gap unchanged.
# ---------------------------------------------------------------------------

server 10.0.0.1 iburst minpoll 2 maxpoll 4 xleave
#   iburst  : lock within a few seconds of boot (matters: RPi 3B+ and stock
#             Jetson Nano have NO battery-backed RTC and boot with a bad clock).
#   minpoll 2 / maxpoll 4 : poll every 4-16 s -> fast tracking on a quiet LAN.
#   xleave  : interleaved mode; uses the server's precise TX timestamp and
#             tightens the offset estimate (both chrony ends support it).

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3          # step only during the first 3 updates, then slew
maxdistance 0.5         # refuse to trust a source whose root distance blows up
rtcsync                 # harmless with no RTC; disciplines it on the RPi 5-class
logdir /var/log/chrony
log tracking measurements statistics

# Per-board NIC / timestamping notes (verify with:  ethtool -T <iface>):
#   rpi3b-1  eth0 = LAN7515 USB-Ethernet  -> SOFTWARE timestamps only.
#   jetson-1 eth0 = Tegra EQOS            -> may expose HW rx/tx timestamps.
#   The Mercusys 8-port switch is UNMANAGED (no PTP boundary/transparent clock),
#   so hardware PTP has no on-path correction and one board cannot HW-stamp at
#   all -> chrony is the correct primary. PTP is used only as an optional
#   cross-check on a HW-capable pair (see timesync/README notes in the design).
