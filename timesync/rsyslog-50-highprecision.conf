# rsyslog-50-highprecision.conf  ->  /etc/rsyslog.d/50-highprecision.conf
# ---------------------------------------------------------------------------
# FALLBACK ONLY. Primary host-log source for alignment is journald JSON
# (journalctl -o json), which already carries __REALTIME_TIMESTAMP (us),
# __MONOTONIC_TIMESTAMP (us) AND _BOOT_ID -> it is the reference implementation
# of our dual-clock + boot-id requirement and needs no configuration.
#
# Use this file only if a text auth.log is also wanted: stock rsyslog writes
# SECOND-granularity timestamps, which is far coarser than a 1 s window. This
# forces RFC3339 timestamps with sub-second precision on the file outputs.
# ---------------------------------------------------------------------------
$ActionFileDefaultTemplate RSYSLOG_FileFormat
# RSYSLOG_FileFormat uses %timegenerated:::date-rfc3339% e.g.
#   2026-09-27T14:03:11.482913+05:30  -> microsecond precision, TZ-explicit.
# Restart: sudo systemctl restart rsyslog
